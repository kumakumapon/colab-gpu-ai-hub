[project]
name = "gpu-ai"
version = "0.1.0"
description = "Shared job contracts and backend interfaces for Colab GPU inference"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["pydantic>=2.10,<3"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "numpy>=1.26,<3", "pillow>=11,<14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
